version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type: local
    image: myregistry.example.com/myapp:${BUILD_NUMBER}
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
    restart: always
    depends_on:
      - db

  db:
    image: mongo:5.0-alpine
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
